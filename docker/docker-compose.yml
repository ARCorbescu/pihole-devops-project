################################################################################
# 🧩 Docker Compose — Local Pi-hole + Tailscale Mesh DNS
#
# Architecture:
#   1️⃣  Pi-hole (BRIDGE)
#       - DNS ad-blocker & web dashboard
#       - Ports 53 (DNS) and 80 (Web Admin) published to host
#       - Accepts queries from host, LAN, and Tailscale interfaces
#
#   2️⃣  Bash Monitor (BRIDGE)
#       - Monitors system resources (CPU, RAM, Disk)
#       - Mounts Docker socket (read-only) to observe container health
#
#   3️⃣  Tailscale (OPTIONAL — profile: tailscale)
#       - Containerised mesh VPN sidecar
#       - Alternative: run the native Tailscale app on your host instead
#
# Quick Start:
#   cp .env.example .env        # configure PIHOLE_PASSWORD
#   docker compose up -d        # start Pi-hole + monitor
#
# With containerised Tailscale:
#   docker compose --profile tailscale up -d
#
# Access:
#   Pi-hole Admin:  http://localhost/admin  (or http://<Tailscale_IP>/admin)
################################################################################

services:
  ##############################################################################
  # 🧱 Pi-hole — DNS Ad Blocker + Web Dashboard
  ##############################################################################
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    hostname: pihole

    dns:
      - 127.0.0.1  # Query self after startup
      - 1.1.1.1    # Upstream fallback during init

    ports:
      - "${DNS_PORT:-53}:53/tcp"
      - "${DNS_PORT:-53}:53/udp"
      - "${WEB_PORT:-80}:80/tcp"

    environment:
      TZ: "${TZ:-Europe/Bucharest}"

      # Pi-hole v6 native configuration
      FTLCONF_webserver_api_password: "${PIHOLE_PASSWORD}"
      FTLCONF_dns_listeningMode: "ALL"
      FTLCONF_dns_upstreams: "${PIHOLE_UPSTREAM_DNS:-1.1.1.1;8.8.8.8}"
      PIHOLE_DNS_: "${PIHOLE_UPSTREAM_DNS:-1.1.1.1;8.8.8.8}"

      DNSSEC: "true"
      REV_SERVER: "false"

    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d

    cap_add:
      - NET_ADMIN

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "dig", "@127.0.0.1", "pi.hole", "+short"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - pihole-network

  ##############################################################################
  # 📊 Bash Monitor — System Resource Monitor
  ##############################################################################
  bash-monitor:
    container_name: bash-monitor
    hostname: bash-monitor

    build:
      context: ..
      dockerfile: docker/Dockerfile.monitor-bash

    depends_on:
      pihole:
        condition: service_healthy

    environment:
      PIHOLE_HOST: "pihole"
      MONITOR_INTERVAL: "${BASH_MONITOR_INTERVAL:-30}"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "pgrep", "-f", "system_monitor.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - pihole-network

  ##############################################################################
  # 🔒 Tailscale — Optional Mesh VPN Sidecar
  #
  # Start with:  docker compose --profile tailscale up -d
  # Or just run the native Tailscale app on your Mac/Linux host.
  ##############################################################################
  tailscale:
    container_name: tailscale
    hostname: pihole-tailscale
    image: tailscale/tailscale:latest
    profiles:
      - tailscale

    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=true
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:---accept-dns=false}

    volumes:
      - ./tailscale-data:/var/lib/tailscale

    restart: unless-stopped

    networks:
      - pihole-network

################################################################################
# 🌐 Network Configuration
################################################################################
networks:
  pihole-network:
    name: pihole-network
    driver: bridge
